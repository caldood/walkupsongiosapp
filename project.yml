name: WalkUp
options:
  bundleIdPrefix: com.walkupapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WalkUp:
    type: application
    platform: iOS
    sources: [WalkUp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkupapp.WalkUp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: WalkUp/Info.plist
      properties:
        CFBundleDisplayName: WalkUp
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationQueriesSchemes: [spotify]
        NSAppleMusicUsageDescription: "WalkUp lets you pick songs from your music library as walk-up songs. Only songs stored on this device can be played."
        UIFileSharingEnabled: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.walkupapp.team-archive
            UTTypeDescription: WalkUp Team Archive
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [walkupteam]
        CFBundleDocumentTypes:
          - CFBundleTypeName: WalkUp Team Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.walkupapp.team-archive]
  WalkUpTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WalkUpTests]
    dependencies:
      - target: WalkUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
