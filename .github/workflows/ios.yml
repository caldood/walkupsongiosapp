name: iOS
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build & test
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          xcodebuild test -project WalkUp.xcodeproj -scheme WalkUp \
            -destination "platform=iOS Simulator,name=$DEST" CODE_SIGNING_ALLOWED=NO
